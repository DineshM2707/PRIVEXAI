services:
  - type: web
    name: privexai-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: privexai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        value: https://privexai-frontend.onrender.com

  - type: web
    name: privexai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://privexai-api.onrender.com/api

databases:
  - name: privexai-db
    databaseName: privexai
    user: privexai
    plan: free
    region: singapore
    postgresMajorVersion: "16"
